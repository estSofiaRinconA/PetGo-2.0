
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | PetGo</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth.js" type="module"></script>
</head>
<body>
  <header class="encabezado">
    <a class="logo" href="/index.html">🐾 PetGo</a>
    <a class="enlace-header" href="/registro.html">
      Registrarse
    </a>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <div class="icono">🐾</div>
      <h1>¡Bienvenido de nuevo!</h1>
      <p class="subtitulo">
        Inicia sesión para continuar en PetGo.
      </p>

      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="email"
          maxlength="254"
          required
        >

        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="submit-btn">
          Iniciar sesión
        </button>
      </form>

      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

      <p class="cambiar">
        ¿Aún no tienes cuenta?
        <a href="/registro.html">Regístrate aquí</a>
      </p>
    </section>
  </main>

  <footer>© 2026 PetGo · Cuidamos a tu mejor amigo 🐾</footer>
</body>
</html>
